name: Lint and Test

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.4.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=3 --memory="1g"
      redis:
        image: redis:7.4.0-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3 --memory="1g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.x
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.x
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed Database
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot testdb < test-server/test-seed.sql

      - name: Run validation check
        run: pnpm run check
        env:
          MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3307/testdb
          REDIS_URL: redis://127.0.0.1:6379

  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.x
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.x
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

  # Smoke test: verify the Docker image builds and starts successfully
  # Catches dependency resolution failures that only surface after pnpm prune (neverinfamous/mysql-mcp#149)
  docker-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.x
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pr-smoke-test:latest
          cache-from: type=gha,scope=pr-smoke
          cache-to: type=gha,scope=pr-smoke,mode=max

      - name: Smoke test — binary loads without crash
        run: |
          docker run --rm pr-smoke-test:latest --help
          echo "✅ Binary load smoke test passed"

      - name: Smoke test — HTTP transport starts
        run: |
          docker run --rm -d --name pr-smoke -p 3000:3000 \
            --health-cmd="wget --spider -q http://127.0.0.1:3000/health || exit 1" \
            --health-interval=2s --health-timeout=2s --health-retries=5 \
            -e MYSQLMCP_PORT=3000 -e MCP_HOST=0.0.0.0 \
            -e ALLOWED_IO_ROOTS=/tmp \
            -e AUDIT_LOG_PATH=/tmp/mcp-audit.jsonl \
            -e OTEL_TRACES_EXPORTER=none -e OTEL_METRICS_EXPORTER=none -e OTEL_LOGS_EXPORTER=none \
            -e TOOL_FILTER=router pr-smoke-test:latest \
            --transport http
          
          timeout 15s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} pr-smoke)" == "healthy" ]; do sleep 1; done' || {
            echo "❌ Docker smoke test failed — container not healthy"
            docker logs pr-smoke 2>&1 || true
            docker stop pr-smoke || true
            exit 1
          }
          docker stop pr-smoke
          echo "✅ Docker smoke test passed"
