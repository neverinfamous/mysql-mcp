name: "CodeQL Analysis"

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"
  workflow_call:
  workflow_dispatch:

env:
  CODEQL_ACTION_FEATURE_SANDWICH: false

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d5668db75ce2361d7637841bd0d3ff7115 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d5668db75ce2361d7637841bd0d3ff7115 # v4.37.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d5668db75ce2361d7637841bd0d3ff7115 # v4.37.0
        with:
          category: "/language:${{matrix.language}}"
