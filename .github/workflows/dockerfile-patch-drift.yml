name: Dockerfile Patch Drift Check

# Fails the job if Dockerfile no longer contains
# "rm -rf /usr/local/lib/node_modules/npm", or if a package.json override
# does not include the registry's latest version. Exact pins fail when
# latest differs. Ranges fail when latest is outside the range.
# npm:pkg@version checks the aliased package.
# Schedule: 12:00 UTC daily. Also workflow_dispatch, and pull_request
# when Dockerfile, package.json, pnpm-workspace.yaml, or pnpm-lock.yaml change
# (no branches filter).

on:
  schedule:
    - cron: "0 12 * * *" # Daily at noon UTC
  pull_request:
    paths:
      - "Dockerfile"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-overrides:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Verify Dockerfile npm removal invariant
        run: |
          echo "🔍 Verifying Dockerfile strips npm and npx from runtime stage..."
          if grep -q "rm -rf /usr/local/lib/node_modules/npm" Dockerfile; then
            echo "✅ Dockerfile removes /usr/local/lib/node_modules/npm in production stage."
          else
            echo "::error::Dockerfile no longer strips /usr/local/lib/node_modules/npm in the runtime stage."
            exit 1
          fi

      - name: Check package.json override drift
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'))
          const overrides = pkg.overrides ?? {}
          let failed = false

          function parts(version) {
            const core = String(version).split('-')[0]
            const nums = core.split('.').map((part) => Number.parseInt(part, 10))
            return [0, 1, 2].map((index) => (Number.isFinite(nums[index]) ? nums[index] : 0))
          }

          function cmp(left, right) {
            const a = parts(left)
            const b = parts(right)
            for (let index = 0; index < 3; index += 1) {
              if (a[index] !== b[index]) return a[index] - b[index]
            }
            return 0
          }

          function satisfies(latest, range) {
            if (range.startsWith('>=')) return cmp(latest, range.slice(2)) >= 0
            if (range.startsWith('^')) {
              const base = range.slice(1)
              const [major, minor, patch] = parts(base)
              const upper = major > 0 ? [major + 1, 0, 0] : minor > 0 ? [0, minor + 1, 0] : [0, 0, patch + 1]
              return cmp(latest, base) >= 0 && cmp(latest, upper.join('.')) < 0
            }
            if (range.startsWith('~')) {
              const base = range.slice(1)
              const [major, minor] = parts(base)
              return cmp(latest, base) >= 0 && cmp(latest, `${major}.${minor + 1}.0`) < 0
            }
            return latest === range
          }

          for (const [name, value] of Object.entries(overrides)) {
            let queryName = name
            let version = value
            if (typeof value === 'string' && value.startsWith('npm:')) {
              const rest = value.slice(4)
              const at = rest.lastIndexOf('@')
              if (at > 0) {
                queryName = rest.slice(0, at)
                version = rest.slice(at + 1)
              }
            }
            if (typeof version !== 'string' || version.length === 0) {
              console.log(`⚠️  ${name}: override is not a version string`)
              continue
            }
            let latest = 'unknown'
            try {
              latest = execFileSync('pnpm', ['view', queryName, 'version'], { encoding: 'utf8' }).trim()
            } catch {
              latest = 'unknown'
            }
            if (latest === 'unknown' || latest.length === 0) {
              console.log(`⚠️  ${queryName}: not found in npm registry`)
              continue
            }
            if (satisfies(latest, version)) {
              console.log(`✅ CURRENT: ${queryName}@${version} — registry latest ${latest} is inside the override`)
            } else {
              console.log(`::error::${queryName} override ${version} does not include registry latest ${latest}`)
              failed = true
            }
          }

          if (failed) process.exit(1)
          NODE
