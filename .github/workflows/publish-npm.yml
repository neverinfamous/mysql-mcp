name: Publish to NPM

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match VERSION file or package.json)"
        required: false
        default: ""
      emergency_bypass:
        description: 'Bypass upstream gatekeeper checks AND environment gates (EMERGENCY ONLY)'
        type: boolean
        required: true
        default: false
      bypass_reason:
        description: 'Justification for bypassing upstream safety gates (required when emergency_bypass is true)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.emergency_bypass == true) && 'npm' || 'dummy' }}
      url: https://www.npmjs.com/package/@${{ github.repository }}

    steps:
      - name: Require emergency bypass acknowledgment
        if: github.event_name == 'workflow_dispatch'
        env:
          BYPASS_REASON: ${{ inputs.bypass_reason }}
        run: |
          if [ "${{ inputs.emergency_bypass }}" != "true" ]; then
            echo "❌ Error: Direct execution via workflow_dispatch bypasses upstream safety gates."
            echo "To proceed, you must explicitly check the 'emergency_bypass' option."
            exit 1
          fi
          if [ ${#BYPASS_REASON} -lt 10 ]; then
            echo "❌ Error: Emergency bypass requires a justification reason of at least 10 characters."
            exit 1
          fi
          echo "⚠️ Emergency Bypass Acknowledged"
          echo "Justification: $BYPASS_REASON"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          if [ -f "VERSION" ]; then
            VERSION=$(head -1 VERSION | tr -d '[:space:]')
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Verify version parameter
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            PKG_VERSION="${{ steps.version.outputs.version }}"
            if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
              echo "Error: Version mismatch!"
              echo "Expected: ${{ inputs.version }}"
              echo "Got: $PKG_VERSION"
              exit 1
            fi
          fi

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Error: Tag version (v$TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches package.json ($PKG_VERSION)"

      - name: Build package
        run: pnpm run build

      - name: Publish to NPM
        # Note: tests and QA gates are expected to be run by the caller (gatekeeper.yml)
        # on the workflow_call path. The emergency path skips them.
        # Bypass logic is deliberately absent on the workflow_call path because upstream gatekeeper validates all safety gates.
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        run: |
          echo "Waiting for npm registry propagation..."
          for i in 1 2 3; do
            sleep 30
            echo "Attempt $i: Checking npm registry..."
            if pnpm view $(node -p "require('./package.json').name")@${{ steps.version.outputs.version }} version --registry https://registry.npmjs.org 2>/dev/null; then
              echo "✅ Package verified on npm registry"
              exit 0
            fi
            echo "Package not yet visible, retrying..."
          done
          echo "⚠️ Package may still be propagating to npm registry. This is informational only."
