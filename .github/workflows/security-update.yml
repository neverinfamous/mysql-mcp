name: Security Update Check

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: security-update-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # C-20: trimmed from write — workflow only reads source

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    outputs:
      scan-failed: ${{ steps.check-scan.outputs.failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: security-test:latest
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=security-test
          cache-to: type=gha,scope=security-test,mode=max

      # Run SARIF scan first (non-blocking) to always generate the file
      - name: Run Trivy vulnerability scanner (Table Output)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: security-test:latest
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: ".trivyignore"
          skip-dirs: "/usr/local/lib/node_modules/npm"
          exit-code: "1" # Fail the build if critical vulnerabilities are found

      - name: Run Trivy vulnerability scanner (JSON/SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: security-test:latest
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: ".trivyignore"
          skip-dirs: "/usr/local/lib/node_modules/npm"
          exit-code: "0" # Don't fail the build here, we want to upload SARIF and then fail on the table output

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-docker-scan

      - name: Check scan result
        id: check-scan
        if: always()
        env:
          TRIVY_OUTCOME: ${{ steps.trivy-scan.outcome }}
        run: |
          if [ "$TRIVY_OUTCOME" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # Separate job for issue creation — scoped with issues: write
  create-issue:
    needs: [security-scan]
    if: ${{ always() && needs.security-scan.outputs.scan-failed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create security issue if vulnerabilities found
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SCHEDULE: ${{ github.event.schedule || 'Manual trigger' }}
        with:
          script: |
            const title = '🚨 Security vulnerabilities detected in Docker images'

            // Check for existing open issue with same title to avoid duplicates
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,vulnerability,docker',
              per_page: 10,
            })
            if (existing.some(issue => issue.title === title)) {
              console.log('Open security issue already exists — skipping creation')
              return
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `
              ## Security Alert

              Trivy has detected security vulnerabilities in our Docker images.

              **Action Required:**
              1. Review the security scan results in the Actions tab
              2. Update base images and dependencies
              3. Test the fixes
              4. Deploy updated images

              **Scan Details:**
              - Workflow run: ${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}
              - Scan Schedule / Trigger: ${process.env.SCHEDULE}

              **Next Steps:**
              - [ ] Review vulnerability details
              - [ ] Update Dockerfiles
              - [ ] Test changes
              - [ ] Deploy fixes
              `,
              labels: ['security', 'vulnerability', 'docker']
            })
