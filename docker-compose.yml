services:
  mysql-mcp:
    build: .
    ports:
      - "${MYSQLMCP_PORT:-3000}:3000"
    command:
      - --transport
      - http
    env_file:
      - .env # Copy .env.example to .env to configure
    environment:
      - MCP_HOST=0.0.0.0
      - MYSQL_HOST=mysql
      # Used for distributed Redis-backed rate limiting for the HTTP Transport layer and Code Mode
      - REDIS_URL=redis://redis:6379
      - MCP_METRICS_EXPORT=prometheus
      - ALLOWED_IO_ROOTS=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:lts
    command: --innodb-use-native-aio=0 --innodb-flush-method=fsync
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: mcp_user
      MYSQL_PASSWORD: secure_password
      MYSQL_DATABASE: testdb
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - mysql-mcp

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:

