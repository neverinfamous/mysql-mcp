services:
  mysql-mcp:
    build: .
    image: writenotenow/mysql-mcp:latest
    ports:
      - "${MYSQLMCP_PORT:-3000}:3000"
    command:
      - --transport
      - http
    env_file:
      - .env # Copy .env.example to .env to configure
    environment:
      - MYSQLMCP_PORT=${MYSQLMCP_PORT:-3000}
      - MCP_HOST=0.0.0.0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_XPORT=33060
      - MYSQL_USER=${MYSQL_USER:-mcp_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secure_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-testdb}
      - MYSQL_POOL_SIZE=${MYSQL_POOL_SIZE:-10}
      - MCP_REQUEST_TIMEOUT=${MCP_REQUEST_TIMEOUT:-600000}
      - MCP_HEADERS_TIMEOUT=${MCP_HEADERS_TIMEOUT:-5000}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - MCP_ENABLE_HSTS=${MCP_ENABLE_HSTS:-false}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - METADATA_CACHE_TTL_MS=${METADATA_CACHE_TTL_MS:-30000}
      - OAUTH_ENABLED=${OAUTH_ENABLED:-false}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_AUDIENCE=${OAUTH_AUDIENCE:-}
      - OAUTH_JWKS_URI=${OAUTH_JWKS_URI:-}
      - OAUTH_CLOCK_TOLERANCE=${OAUTH_CLOCK_TOLERANCE:-}
      - MYSQL_ROUTER_URL=${MYSQL_ROUTER_URL:-}
      - MYSQL_ROUTER_USER=${MYSQL_ROUTER_USER:-}
      - MYSQL_ROUTER_PASSWORD=${MYSQL_ROUTER_PASSWORD:-}
      - MYSQL_ROUTER_INSECURE=${MYSQL_ROUTER_INSECURE:-}
      - PROXYSQL_HOST=${PROXYSQL_HOST:-}
      - PROXYSQL_PORT=${PROXYSQL_PORT:-}
      - PROXYSQL_USER=${PROXYSQL_USER:-}
      - PROXYSQL_PASSWORD=${PROXYSQL_PASSWORD:-}
      # Distributed Redis-backed rate limiting
      - REDIS_URL=redis://redis:6379
      - MCP_RATE_LIMIT_MAX=${MCP_RATE_LIMIT_MAX:-10000}
      - CODEMODE_RATE_LIMIT_MAX=${CODEMODE_RATE_LIMIT_MAX:-60}
      - MCP_METRICS_EXPORT=${MCP_METRICS_EXPORT:-prometheus}
      - ALLOWED_IO_ROOTS=/app/data
      - AUDIT_LOG_PATH=/app/data/audit.jsonl
      - CODE_MODE_MAX_RESULT_SIZE=${CODE_MODE_MAX_RESULT_SIZE:-102400}
      - CODEMODE_ISOLATION=${CODEMODE_ISOLATION:-sandbox}
      - MYSQLSH_PATH=${MYSQLSH_PATH:-mysqlsh}
      - TOOL_FILTER=${TOOL_FILTER:-starter}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:lts
    command: --innodb-use-native-aio=0 --innodb-flush-method=fsync
    ports:
      - "${MYSQL_PORT:-3306}:3306"
      - "${MYSQL_XPORT:-33060}:33060"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_password}
      MYSQL_USER: ${MYSQL_USER:-mcp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testdb}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - mysql-mcp

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:

