services:
  mysql-mcp:
    build: .
    image: writenotenow/mysql-mcp:latest
    ports:
      - "${MYSQLMCP_PORT:-3000}:${MYSQLMCP_PORT:-3000}"
    command:
      - --transport
      - http
    env_file:
      - .env # Copy .env.example to .env to configure
    environment:
      - MYSQLMCP_PORT=${MYSQLMCP_PORT:-3000}
      - MCP_HOST=0.0.0.0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_XPORT=33060
      - MYSQL_USER=${MYSQL_USER:-mcp_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secure_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-testdb}
      - MYSQL_POOL_SIZE=${MYSQL_POOL_SIZE:-10}
      # Distributed Redis-backed rate limiting
      - REDIS_URL=redis://redis:6379
      - MCP_RATE_LIMIT_MAX=${MCP_RATE_LIMIT_MAX:-10000}
      - CODEMODE_RATE_LIMIT_MAX=${CODEMODE_RATE_LIMIT_MAX:-60}
      - MCP_METRICS_EXPORT=${MCP_METRICS_EXPORT:-prometheus}
      - ALLOWED_IO_ROOTS=/app/data
      - AUDIT_LOG_PATH=/app/data/audit.jsonl
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:lts
    command: --innodb-use-native-aio=0 --innodb-flush-method=fsync
    ports:
      - "3306:3306"
      - "33060:33060"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_password}
      MYSQL_USER: ${MYSQL_USER:-mcp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testdb}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - mysql-mcp

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:

