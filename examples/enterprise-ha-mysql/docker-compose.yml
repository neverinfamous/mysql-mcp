services:
  example-ha-node1:
    image: mysql:9.1.0
    container_name: example-ha-node1
    hostname: example-ha-node1
    restart: unless-stopped
    ports:
      - "3317:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysqlmcp}
    volumes:
      - example-ha-node-data:/var/lib/mysql
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --server-id=1
      --enforce-gtid-consistency=ON
      --gtid-mode=ON
      --binlog-checksum=NONE
      --plugin-load-add=group_replication.so
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mysqlmcp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.datadoghq.ad.check_names: '["mysql"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":3306, "username":"root", "password":"${MYSQL_ROOT_PASSWORD:-mysqlmcp}"}]'

  example-ha-node2:
    image: mysql:9.1.0
    container_name: example-ha-node2
    hostname: example-ha-node2
    restart: unless-stopped
    ports:
      - "3318:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysqlmcp}
    volumes:
      - example-ha-node-data:/var/lib/mysql
    command: >
      --server-id=2
      --enforce-gtid-consistency=ON
      --gtid-mode=ON
      --binlog-checksum=NONE
      --plugin-load-add=group_replication.so
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mysqlmcp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  example-ha-node3:
    image: mysql:9.1.0
    container_name: example-ha-node3
    hostname: example-ha-node3
    restart: unless-stopped
    ports:
      - "3319:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysqlmcp}
    volumes:
      - example-ha-node-data:/var/lib/mysql
    command: >
      --server-id=3
      --enforce-gtid-consistency=ON
      --gtid-mode=ON
      --binlog-checksum=NONE
      --plugin-load-add=group_replication.so
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mysqlmcp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  example-ha-router:
    image: container-registry.oracle.com/mysql/community-router:9.1.0
    container_name: example-ha-router
    restart: unless-stopped
    depends_on:
      example-ha-node1:
        condition: service_healthy
      example-ha-node2:
        condition: service_healthy
      example-ha-node3:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "/docker-entrypoint-initdb.d/router-init.sh" ]
    volumes:
      - ./config/example-ha-router/router-init.sh:/docker-entrypoint-initdb.d/router-init.sh
    tmpfs:
      - /tmp/mysqlrouter:uid=999,gid=999
    ports:
      - "6456:6446"
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "6446", "-uroot", "-proot", "-e", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  example-ha-proxysql:
    image: example-ha-proxysql/example-ha-proxysql:2.6.3
    container_name: example-ha-proxysql
    restart: unless-stopped
    depends_on:
      example-ha-router:
        condition: service_healthy
    ports:
      - "6042:6032"
      - "6043:6033"
    volumes:
      - ./config/example-ha-proxysql/example-ha-proxysql.cnf:/etc/example-ha-proxysql.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "6033", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.datadoghq.ad.check_names: '["example-ha-proxysql"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6032, "username":"admin", "password":"admin"}]'
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  example-ha-datadog:
    image: gcr.io/datadoghq/agent:7.81.0
    container_name: example-ha-datadog
    restart: unless-stopped
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_HOSTNAME=adamic-wsl2
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_APM_ENABLED=true
      - DD_PROCESS_AGENT_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
    mem_limit: 512m
    cgroup: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  example-ha-node-data:
  example-ha-node-data:
  example-ha-node-data:
