init_config:

ad_identifiers:
  - mysql

instances:
  - host: "%%host%%"
    username: root
    password: root
    port: 3306
    options:
      replication: false
      galera_cluster: false
      extra_status_metrics: true
      extra_innodb_metrics: true
      extra_performance_metrics: false
      schema_size_metrics: false
      disable_innodb_metrics: false
    tags:
      - "hostname:adamic-wsl2"
    reported_hostname: adamic-wsl2
    custom_queries:
      - metric_prefix: mysql.group_replication
        query: >
          SELECT COUNT_TRANSACTIONS_IN_QUEUE, COUNT_TRANSACTIONS_REMOTE_IN_APPLIER_QUEUE
          FROM performance_schema.replication_group_member_stats
          WHERE MEMBER_ID = @@server_uuid
        columns:
          - name: transactions_in_queue
            type: gauge
          - name: transactions_remote_in_applier_queue
            type: gauge
        tags:
          - "custom_query:group_replication_lag"

