services:
  mysql-server:
    image: mysql:9.7.1
    container_name: example-basic-mysql
    restart: unless-stopped
    ports:
      - "3316:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysqlmcp}
      MYSQL_DATABASE: testdb
    volumes:
      - mysql-data:/var/lib/mysql
    stop_grace_period: 30s
    mem_limit: 1024m
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance_schema=ON
      --relay-log=mysql-server-relay-bin
    labels:
      com.datadoghq.ad.check_names: '["mysql"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":3306, "reported_hostname":"adamic-wsl2", "username":"root", "password":"${MYSQL_ROOT_PASSWORD:-mysqlmcp}", "options": {"replication": false, "extra_status_metrics": true, "extra_innodb_metrics": true, "extra_performance_metrics": false}}]'
      com.datadoghq.ad.logs: '[{"source":"mysql","service":"mysql"}]'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mysqlmcp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  example-basic-datadog:
    image: gcr.io/datadoghq/agent:7.81.3
    container_name: example-basic-datadog
    restart: unless-stopped
    pid: host
    cgroup: host
    stop_grace_period: 30s
    mem_limit: 1536m
    depends_on:
      mysql-server:
        condition: service_healthy
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_HOSTNAME=adamic-wsl2
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_APM_ENABLED=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_SYSTEM_PROBE_ENABLED=true
      - DD_DOCKER_LABELS_AS_TAGS={"com.docker.compose.service":"service_name"}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /etc/os-release:/host/etc/os-release:ro
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
    labels:
      com.datadoghq.ad.logs: '[{"source":"example-basic-datadog","service":"example-basic-datadog"}]'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "agent health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql-data:
