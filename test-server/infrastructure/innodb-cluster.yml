services:
  mysql-node1:
    image: mysql:8.0
    container_name: mysql-node1
    restart: unless-stopped
    hostname: mysql-node1
    networks:
      - innodb-cluster-net
    ports:
      - "3307:3306"
      - "33061:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --binlog-transaction-dependency-tracking=WRITESET
      --report_host=mysql-node1
      --innodb-use-native-aio=0
      --innodb-flush-method=fsync
    volumes:
      - mysql-node1-data-v4:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-node2:
    image: mysql:8.0
    container_name: mysql-node2
    restart: unless-stopped
    hostname: mysql-node2
    networks:
      - innodb-cluster-net
    ports:
      - "3308:3306"
      - "33062:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --binlog-transaction-dependency-tracking=WRITESET
      --report_host=mysql-node2
      --innodb-use-native-aio=0
      --innodb-flush-method=fsync
    volumes:
      - mysql-node2-data-v4:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-node3:
    image: mysql:8.0
    container_name: mysql-node3
    restart: unless-stopped
    hostname: mysql-node3
    networks:
      - innodb-cluster-net
    ports:
      - "3309:3306"
      - "33063:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --binlog-transaction-dependency-tracking=WRITESET
      --report_host=mysql-node3
      --innodb-use-native-aio=0
