init_config:

instances:
  - openmetrics_endpoint: http://host.docker.internal:3000/metrics
    namespace: mysql_mcp
    tags:
      - service:mysql_mcp
      - env:development
    min_collection_interval: 15
    metrics:
      - mysql_mcp_tool_calls
      - mysql_mcp_tool_errors
      - mysql_mcp_tool_tokens
      - mysql_mcp_tool_tokens_per_call
      - mysql_mcp_tool_latency_ms_p50
      - mysql_mcp_tool_latency_ms_p95
      - mysql_mcp_tool_latency_ms_p99
      - mysql_mcp_resource_reads
      - mysql_mcp_uptime_seconds
      - mysql_mcp_cache_hits
      - mysql_mcp_cache_misses
      - mysql_mcp_pool_connections_total
      - mysql_mcp_pool_connections_active
      - mysql_mcp_pool_connections_idle
      - mysql_mcp_pool_queries
