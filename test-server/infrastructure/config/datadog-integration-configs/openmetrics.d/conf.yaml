init_config:

instances:
  - openmetrics_endpoint: http://mysql-mcp-exporter:3000/metrics
    namespace: mysql_mcp
    tags:
      - service:mysql_mcp
      - env:development
    send_monotonic_counter: true
    min_collection_interval: 15
    timeout: 10
    max_returned_metrics: 10000
    metrics:
      - '.*'
