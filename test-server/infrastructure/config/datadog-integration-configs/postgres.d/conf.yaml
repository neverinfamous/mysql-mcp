init_config:

ad_identifiers:
  - postgres-hypopg

instances:
  - host: "%%host%%"
    port: 5432
    username: postgres
    password: postgres
    dbname: postgres
    tags:
      - "hostname:adamic-wsl2"
      - "environment:development"
      - "service:postgres-enhanced"
    reported_hostname: adamic-wsl2
    
    # Enable comprehensive monitoring
    collect_function_metrics: true
    collect_count_metrics: true
    collect_activity_metrics: true
    collect_database_size_metrics: true
    collect_default_database: true
    
    # Disable query sampling to prevent re-execution of queries from pg_stat_statements
    query_samples:
      enabled: false
    query_metrics:
      enabled: false
    query_activity:
      enabled: false
    
    # Disable WAL stats for PostgreSQL 18 compatibility
    # PostgreSQL 18 removed several columns from pg_stat_wal (wal_write, wal_sync, wal_write_time, wal_sync_time)
    # See: https://www.postgresql.org/docs/18/release-18.html
    # NOTE: collect_wal_metrics: false setting doesn't work in Datadog agent (tested 7.70.0-7.73.0)
    # Waiting for Datadog agent update with full PostgreSQL 18 support
    collect_wal_metrics: false
    
    # Custom queries for enhanced monitoring
    custom_queries:
      - metric_prefix: postgresql.custom
        query: SELECT schemaname, relname as tablename, n_tup_ins, n_tup_upd, n_tup_del FROM pg_stat_user_tables;
        columns:
          - name: schemaname
            type: tag
          - name: tablename  
            type: tag
          - name: n_tup_ins
            type: monotonic_count
          - name: n_tup_upd
            type: monotonic_count
          - name: n_tup_del
            type: monotonic_count
        tags:
          - "custom_query:table_stats"
