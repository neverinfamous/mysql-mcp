services:
  # ==========================================
  # INNODB CLUSTER
  # ==========================================
  mysql-node1:
    image: mysql:9.1
    container_name: mysql-node1
    restart: unless-stopped
    hostname: mysql-node1
    ports:
      - "3307:3306"
      - "33061:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: testdb
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --report_host=mysql-node1
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=48M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-node1-data-v5:/var/lib/mysql
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 10

  mysql-node2:
    image: mysql:9.1
    container_name: mysql-node2
    restart: unless-stopped
    hostname: mysql-node2
    ports:
      - "3308:3306"
      - "33062:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --report_host=mysql-node2
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=48M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-node2-data-v5:/var/lib/mysql
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 10

  mysql-node3:
    image: mysql:9.1
    container_name: mysql-node3
    restart: unless-stopped
    hostname: mysql-node3
    ports:
      - "3309:3306"
      - "33063:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --report_host=mysql-node3
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=48M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-node3-data-v5:/var/lib/mysql
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==========================================
  # ROUTING & PROXIES
  # ==========================================
  mysql-router:
    image: container-registry.oracle.com/mysql/community-router:9.1.0
    container_name: mysql-router
    restart: unless-stopped
    depends_on:
      mysql-node1:
        condition: service_healthy
      mysql-node2:
        condition: service_healthy
      mysql-node3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/router-init.sh"]
    volumes:
      - ./config/mysql-router/router-init.sh:/docker-entrypoint-initdb.d/router-init.sh
    tmpfs:
      - /tmp/mysqlrouter:uid=999,gid=999
    ports:
      - "6446:6446"
      - "6447:6447"
      - "8443:8443"
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "6446", "-uroot", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 10

  proxysql:
    image: proxysql/proxysql:latest
    container_name: proxysql
    restart: unless-stopped
    ports:
      - "6032:6032"
      - "6033:6033"
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MONITORING
  # ==========================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-node1-data-v5:
  mysql-node2-data-v5:
  mysql-node3-data-v5:
