services:
  # ==========================================
  # INNODB CLUSTER
  # ==========================================
  mysql-node1:
    image: mysql:9.1.0
    container_name: mysql-node1
    restart: unless-stopped
    hostname: mysql-node1
    ports:
      - "3307:3306"
      - "33061:33060"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      TZ: America/New_York
    command: >
      --server-id=1 --log-bin=mysql-bin --gtid_mode=ON
      --enforce_gtid_consistency=ON --log_replica_updates=ON
      --report_host=mysql-node1 --innodb-use-native-aio=0
      --innodb-flush-method=fsync --innodb-buffer-pool-size=128M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-node1-data-v4:/var/lib/mysql
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 30
    labels:
      - 'com.datadoghq.ad.logs=[{"source":"mysql","service":"mysql-node1"}]'

  mysql-node2:
    image: mysql:9.1.0
    container_name: mysql-node2
    restart: unless-stopped
    hostname: mysql-node2
    ports:
      - "3308:3306"
      - "33062:33060"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      TZ: America/New_York
    command: >
      --server-id=2 --log-bin=mysql-bin --gtid_mode=ON
      --enforce_gtid_consistency=ON --log_replica_updates=ON
      --report_host=mysql-node2 --innodb-use-native-aio=0
      --innodb-flush-method=fsync --innodb-buffer-pool-size=128M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-node2-data-v4:/var/lib/mysql
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 30
    labels:
      - 'com.datadoghq.ad.logs=[{"source":"mysql","service":"mysql-node2"}]'

  mysql-node3:
    image: mysql:9.1.0
    container_name: mysql-node3
    restart: unless-stopped
    hostname: mysql-node3
    ports:
      - "3309:3306"
      - "33063:33060"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      TZ: America/New_York
    command: >
      --server-id=3 --log-bin=mysql-bin --gtid_mode=ON
      --enforce_gtid_consistency=ON --log_replica_updates=ON
      --report_host=mysql-node3 --innodb-use-native-aio=0
      --innodb-flush-method=fsync --innodb-buffer-pool-size=128M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-node3-data-v4:/var/lib/mysql
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 30
    labels:
      - 'com.datadoghq.ad.logs=[{"source":"mysql","service":"mysql-node3"}]'

  # ==========================================
  # ROUTING & PROXIES
  # ==========================================
  mysql-router:
    image: container-registry.oracle.com/mysql/community-router:9.1.0
    container_name: mysql-router
    restart: unless-stopped
    depends_on:
      mysql-node1:
        condition: service_healthy
      mysql-node2:
        condition: service_healthy
      mysql-node3:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "/docker-entrypoint-initdb.d/router-init.sh" ]
    volumes:
      - ./config/mysql-router/router-init.sh:/docker-entrypoint-initdb.d/router-init.sh
    tmpfs:
      - /tmp/mysqlrouter:uid=999,gid=999
    ports:
      - "6446:6446"
      - "6447:6447"
      - "8443:8443"
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.datadoghq.ad.check_names: '["mysql"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6446,
        "username":"root", "password":"root", "options": {"replication": false,
        "extra_status_metrics": true, "extra_innodb_metrics": false,
        "extra_performance_metrics": false}}]'
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-P",
          "6446",
          "-uroot",
          "-proot"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  proxysql:
    image: proxysql/proxysql:2.6.3
    container_name: proxysql
    restart: unless-stopped
    ports:
      - "6032:6032"
      - "6033:6033"
    volumes:
      - ./config/proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.datadoghq.ad.check_names: '["proxysql"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6032,
        "username":"radmin", "password":"radmin"}]'
      com.datadoghq.ad.logs: '[{"source":"proxysql","service":"proxysql"}]'

  redis-server:
    image: redis:7.4.0
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: America/New_York
    command: redis-server --save 60 1 --loglevel warning
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.datadoghq.ad.check_names: '["redisdb"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6379}]'
      com.datadoghq.ad.logs: '[{"source":"redis","service":"redis-server"}]'

  # ==========================================
  # MONITORING & TOOLS
  # ==========================================
  dozzle:
    image: amir20/dozzle:v10.6.9
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST_IP:-192.168.1.70}"
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    stop_grace_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  datadog-unified:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-unified
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DD_SITE=datadoghq.com
      - DD_LOGS_ENABLED=true
      - DD_PROCESS_CONFIG_CONTAINER_COLLECTION_ENABLED=true
      - DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED=true
      - DD_KUBERNETES_COLLECT_METADATA_TAGS=false
      - DD_COLLECT_KUBERNETES_EVENTS=false
      - DD_HOSTNAME=docker-desktop
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./config/datadog-integration-configs:/etc/datadog-agent/conf.d:ro
    networks:
      - default
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-node1-data-v4:
  mysql-node2-data-v4:
  mysql-node3-data-v4:
networks: {}
