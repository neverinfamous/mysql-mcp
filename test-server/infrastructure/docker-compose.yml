services:
  # ==========================================
  # INNODB CLUSTER
  # ==========================================
  mysql-node1:
    image: mysql:8.0
    container_name: mysql-node1
    restart: unless-stopped
    hostname: mysql-node1
    ports:
      - "3307:3306"
      - "33061:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --binlog-transaction-dependency-tracking=WRITESET
      --report_host=mysql-node1
      --innodb-use-native-aio=0
      --innodb-flush-method=fsync
    volumes:
      - mysql-node1-data-v4:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-node2:
    image: mysql:8.0
    container_name: mysql-node2
    restart: unless-stopped
    hostname: mysql-node2
    ports:
      - "3308:3306"
      - "33062:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --binlog-transaction-dependency-tracking=WRITESET
      --report_host=mysql-node2
      --innodb-use-native-aio=0
      --innodb-flush-method=fsync
    volumes:
      - mysql-node2-data-v4:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-node3:
    image: mysql:8.0
    container_name: mysql-node3
    restart: unless-stopped
    hostname: mysql-node3
    ports:
      - "3309:3306"
      - "33063:33060"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --binlog-transaction-dependency-tracking=WRITESET
      --report_host=mysql-node3
      --innodb-use-native-aio=0
      --innodb-flush-method=fsync
    volumes:
      - mysql-node3-data-v4:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ==========================================
  # ROUTING & PROXIES
  # ==========================================
  mysql-router:
    image: mysql/mysql-router:8.0
    container_name: mysql-router
    depends_on:
      - mysql-node1
      - mysql-node2
      - mysql-node3
    environment:
      MYSQL_HOST: mysql-node1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "6446:6446"
      - "6447:6447"
      - "8443:8443"

  proxysql:
    image: proxysql/proxysql:latest
    container_name: proxysql
    restart: unless-stopped
    ports:
      - "6032:6032"
      - "6033:6033"

  # ==========================================
  # MONITORING
  # ==========================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  mysql-node1-data-v4:
  mysql-node2-data-v4:
  mysql-node3-data-v4:
