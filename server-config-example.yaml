# Centralized, type-safe configuration for enterprise MySQL MCP deployment.
#
# MySQL MCP Server Configuration Example
# Load this configuration by running: mysql-mcp --config path/to/server-config-example.yaml
#
# Configuration Priority: CLI Flags > Environment Variables > Config File > Defaults
# For database connections and OAuth settings, the entire array/object must come from a single source
# to prevent mixing environments (e.g. CLI databases will fully override FILE databases).

# Server Core Settings
# Docker mapping requirements: set host to 0.0.0.0 and adjust allowedIoRoots to match mounted volumes.
host: "127.0.0.1"
port: 3000
# Defaults to stdio. Use http for docker-compose configurations.
transport: "stdio" # or "http"
enableHSTS: false
trustProxy: false
_comment_stateless: "MCP v2 stateless HTTP mode using NodeStreamableHTTPServerTransport over /mcp"
stateless: false
authToken: "your-secure-auth-token"
metricsExport: "prometheus"

# CORS Configuration
cors:
  origins:
    - "https://trusted-client.example.com"
  allowCredentials: true

# Tooling and Sandbox
toolFilter: "codemode"
allowedIoRoots:
  - "C:/temp/mcp-sandbox"
  - "/tmp/mcp-sandbox"

# Audit Logging Configuration
auditConfig:
  enabled: true
  logPath: "/var/log/mysql-mcp/mcp-audit.jsonl"
  redact: true
  auditReads: false
  maxSizeBytes: 10485760 # 10MB
  backup:
    enabled: true
    includeData: false
    maxDataSizeBytes: 1048576 # 1MB

# Databases Configuration
# Only the first database in the array is currently connected/supported by the MySQL adapter.
databases:
  - type: "mysql"
    host: "localhost"
    port: 3306
    username: "mcp_user"
    password: "secure_password"
    database: "testdb"
    options:
      ssl: true
    pool:
      connectionLimit: 10
      acquireTimeout: 10000 # recommended lower value for tight integration
      waitForConnections: true
      queueLimit: 0

# OAuth 2.1 Resource Server Settings (Optional)
oauth:
  enabled: false
  issuer: "https://auth.example.com"
  audience: "mysql-mcp-client"
  jwksUri: "https://auth.example.com/.well-known/jwks.json"
  clockTolerance: 60

# Advanced & Ecosystem Features
# Many configuration options can also be specified natively as camelCase properties. REDIS_URL, CODEMODE_ISOLATION, PROXYSQL_HOST, PROXYSQL_PORT, PROXYSQL_USER, PROXYSQL_PASSWORD, MYSQL_ROUTER_URL, MYSQL_ROUTER_USER, MYSQL_ROUTER_PASSWORD, MYSQL_ROUTER_INSECURE, MYSQLSH_PATH, and LOG_LEVEL features, as well as CODEMODE_MAX_RESULT_SIZE, METADATA_CACHE_TTL_MS, MCP_RATE_LIMIT_MAX, CODEMODE_RATE_LIMIT_MAX, MYSQL_XPORT, DD_API_KEY, DD_APP_KEY, DD_HOSTNAME, DD_SITE, DD_EXTRA_PERFORMANCE_METRICS, and OTEL_EXPORTER_OTLP_ENDPOINT are injected via environment variables.
