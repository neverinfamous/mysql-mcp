      --report_host=mysql-node2
      --plugin_load_add=group_replication.so
      --loose-group_replication_group_name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      --loose-group_replication_start_on_boot=ON
      --loose-group_replication_local_address=mysql-node2:33062
      --loose-group_replication_group_seeds=mysql-node1:33061,mysql-node2:33062,mysql-node3:33063
      --loose-group_replication_bootstrap_group=OFF
    volumes:
      - mysql-node2-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-node3:
    image: mysql:8.4
    container_name: mysql-node3
    restart: unless-stopped
    hostname: mysql-node3
    networks:
      - innodb-cluster-net
