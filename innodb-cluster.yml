services:
  mysql-node1:
    image: mysql:8.4
    container_name: mysql-node1
    restart: unless-stopped
    hostname: mysql-node1
    networks:
      - innodb-cluster-net
    ports:
      - "3307:3306"
      - "33061:33060"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: '%'
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_replica_updates=ON
      --binlog_format=ROW
      --report_host=mysql-node1
      --plugin_load_add=group_replication.so
      --loose-group_replication_group_name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      --loose-group_replication_start_on_boot=ON
      --loose-group_replication_local_address=mysql-node1:33061
      --loose-group_replication_group_seeds=mysql-node1:33061,mysql-node2:33062,mysql-node3:33063
      --loose-group_replication_bootstrap_group=OFF
    volumes:
      - mysql-node1-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-node2:
